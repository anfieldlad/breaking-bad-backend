[project]
name = "breaking-bad-backend"
version = "1.0.0"
description = "Breaking B.A.D. RAG chatbot API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import sorting
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "ASYNC",         # blocking calls in async code
]
ignore = [
    "B008",  # FastAPI's File()/Depends() defaults are idiomatic
    "S104",  # binding 0.0.0.0 is intended inside containers/PaaS
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy secrets are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
